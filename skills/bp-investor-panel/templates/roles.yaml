  # ==================== 第三层：财务尽调官（1 席） ====================

  - id: fdd_officer
    name: "财务尽调官"
    firm_type: "财务尽调（FDD）／投资方委托的第三方"
    benchmark: "尽调实务通行标准（勾稽、口径一致性、收入确认合规）"
    tier: "第三层｜财务尽调官"
    stage: "覆盖全阶段（由投资方委托介入）"
    ticket: "不投钱；出具尽调报告作为投委会的投资前提条件，但对交易有一票否决的实际影响力"
    decision_process: "尽调启动 → 资料清单与访谈 → 三表勾稽与抽样核查 → 出具尽调报告（含重大发现与建议条款）→ 提交投资决策委员会作为投资前提条件"
    philosophy: "同一份材料里不允许出现两个口径的数字——勾稽对不上，估值直接归零。"
    weights: {市场: 10, 团队: 10, 产品壁垒: 5, 商业模式: 15, 财务预测: 40, 融资方案: 20}
    gate_dimension: 风险合规
    cross_exam:
      - "这个数字从哪来的？有台账、后台截图、合同或者银行流水吗？"
      - "第七页和第十二页的数打架了，哪个是真的？"
      - "客户数乘 ARPU 乘合同周期，能不能乘出你写的收入？乘不出来就是勾稽错。"
      - "毛利率从 52% 涨到 76%，谁在驱动？可验证吗？"
      - "收入确认政策是什么？是履约进度法还是完工法？符合准则吗？"
    veto: "存在任一 P0 级勾稽错误（同一指标两处口径冲突、乘法算不通、数字差量级）；或 财务预测<50；或 收入确认不合规或关键数字无出处"
    extra_requirements:
      - "三表（资产负债表/利润表/现金流量表）+ 逐月管理报表"
      - "客户合同清单、发票台账、银行流水与回款记录"
      - "审计报告与收入确认政策说明"
      - "股权与期权结构表、关联交易清单"
      - "全文口径对照表（同一指标在不同页的数值必须一致）"
    lens:
      - "全文数字勾稽：客户数×ARPU=收入、市占率×市场规模=收入、融资额÷出让比例=投前估值"
      - "同一指标在不同页的口径与数值一致性"
      - "预测的驱动假设是否可验证、是否与历史实际值同口径"
      - "收入确认、成本结构、税负与现金流是否闭环"
      - "关联交易与体外循环风险"
    page_focus: [6, 7, 10, 12, 13]
